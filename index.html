<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>D3 Kids</title>
  <meta name="description" content="D3 Kids. Sensorisch speelgoed, geprint met Georgette. Zeg hallo of volg ons op Instagram.">
  <meta name="theme-color" content="#f7f4ef">
  <link rel="icon" href="logo-mark.png" type="image/png">
  <style>
    :root {
      --paper: #f7f4ef;
      --ink: #1a1a1a;
      --muted: #5c534c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    .top {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
      padding: 18px 22px 0;
    }

    .tabs { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

    .tab, .lang {
      font: inherit;
      font-weight: 700;
      font-size: 15px;
      color: var(--ink);
      background: transparent;
      border: 2px solid transparent;
      border-radius: 999px;
      min-height: 40px;
      padding: 0 14px;
      cursor: pointer;
    }

    #tab-shop,
    #panel-shop { display: none !important; }

    .tab[aria-selected="true"] {
      border-color: var(--ink);
      background: #fff;
    }

    .tab:hover, .lang:hover { background: rgba(26, 26, 26, 0.05); }

    .lang {
      border-color: var(--ink);
      background: #fff;
      padding-right: 10px;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: min(680px, calc(100% - 40px));
      margin: 0 auto;
      padding: 12px 0 56px;
      text-align: center;
    }

    .stage {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 62vh;
      transition: min-height 0.45s ease;
    }

    body[data-view="about"] .stage,
    body[data-view="shop"] .stage,
    body[data-view="concept"] .stage {
      min-height: 0;
      margin-top: 8px;
    }

    .lockup {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: min(460px, 88vw);
      transition: width 0.45s ease;
    }

    body[data-view="about"] .lockup,
    body[data-view="shop"] .lockup,
    body[data-view="concept"] .lockup {
      width: min(168px, 40vw);
    }

    .print-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 704 / 695;
    }

    .logo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: transparent;
    }

    .scene { clip-path: inset(97% 0 0 0); }
    .nozzle { transform: translateY(58%); }
    .complete { opacity: 0; }

    .lockup.is-printing .scene {
      animation: scene-up 2.7s cubic-bezier(0.42, 0, 0.2, 1) forwards;
    }

    .lockup.is-printing .nozzle {
      animation: nozzle-up 2.7s cubic-bezier(0.42, 0, 0.2, 1) forwards;
    }

    .lockup.is-ready .complete { opacity: 1; }
    .lockup.is-ready .scene,
    .lockup.is-ready .nozzle { opacity: 0; }

    @keyframes nozzle-up {
      0% { transform: translateY(58%); }
      78% { transform: translateY(0); }
      100% { transform: translateY(0); }
    }

    @keyframes scene-up {
      0% { clip-path: inset(97% 0 0 0); }
      78% { clip-path: inset(39% 0 0 0); }
      100% { clip-path: inset(0 0 0 0); }
    }

    .wordmark {
      margin: 10px 0 0;
      font-size: clamp(32px, 6vw, 52px);
      font-weight: 800;
      letter-spacing: -0.045em;
      line-height: 1;
      opacity: 0;
      transform: translateY(10px);
    }

    .lockup.is-ready .wordmark {
      opacity: 1;
      transform: none;
      transition: opacity 0.45s ease, transform 0.45s ease;
    }

    body:not([data-view="home"]) .wordmark { display: none; }

    .actions {
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
    }

    body.is-ready .actions,
    body:not([data-view="home"]) .actions {
      opacity: 1;
      transform: none;
      pointer-events: auto;
      transition: opacity 0.45s ease, transform 0.45s ease;
    }

    .panel {
      max-width: 38rem;
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transform: translateY(8px);
      transition: max-height 0.45s ease, opacity 0.35s ease, transform 0.45s ease, margin 0.45s ease;
    }

    body[data-view="about"] #panel-about,
    body[data-view="shop"] #panel-shop,
    body[data-view="concept"] #panel-concept {
      max-height: 28rem;
      opacity: 1;
      transform: none;
      margin-top: 22px;
    }

    body[data-view="concept"] #panel-concept {
      max-height: 140rem;
    }

    .panel p {
      margin: 0 0 14px;
      font-size: 18px;
      line-height: 1.5;
      color: var(--muted);
    }

    .panel p:last-child { margin-bottom: 0; }

    .panel p.ask {
      margin-top: 18px;
      color: var(--ink);
      font-weight: 700;
    }

    .soon {
      margin: 6px 0 0;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--ink);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 28px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 148px;
      min-height: 48px;
      padding: 0 18px;
      border-radius: 999px;
      border: 2px solid var(--ink);
      text-decoration: none;
      font: inherit;
      font-weight: 700;
      font-size: 16px;
      color: var(--ink);
    }

    .btn svg { width: 18px; height: 18px; flex: none; }
    .wave { transform-origin: 70% 85%; animation: wave 1.6s ease-in-out infinite; }
    @keyframes wave {
      0%, 55%, 100% { transform: rotate(0deg); }
      12% { transform: rotate(18deg); }
      24% { transform: rotate(-10deg); }
      36% { transform: rotate(16deg); }
      48% { transform: rotate(-4deg); }
    }
    .btn-contact { background: var(--ink); color: #fff; }
    .btn-contact:hover { background: #333; }
    .btn-ig:hover { background: rgba(26, 26, 26, 0.06); }

    .tab:focus-visible, .lang:focus-visible, .btn:focus-visible {
      outline: 3px solid #c9a15b;
      outline-offset: 3px;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }

    .game {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(26, 26, 26, 0.46);
      z-index: 20;
    }

    .game.open { display: flex; }

    .game-card {
      width: min(460px, 100%);
      background: var(--paper);
      border-radius: 28px;
      padding: 18px 18px 16px;
      box-shadow: 0 24px 60px rgba(26, 26, 26, 0.2);
    }

    .game-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .game-bar strong { font-size: 18px; }
    .game-bar span { color: var(--muted); font-weight: 700; }

    .game-close {
      border: 0;
      background: transparent;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      min-width: 36px;
      min-height: 36px;
      border-radius: 999px;
    }

    .game-close:hover { background: rgba(26, 26, 26, 0.06); }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #fff;
      border-radius: 18px;
    }

    .game-help {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
    }

    @media (max-width: 720px) {
      .top { justify-content: center; flex-wrap: wrap; }
    }

    @media (prefers-reduced-motion: reduce) {
      .stage, .logo, .panel, .lockup, .wordmark, .actions { transition: none; }
      .wave { animation: none; }
      .lockup.is-printing .scene,
      .lockup.is-printing .nozzle { animation: none; }
    }
  </style>
</head>

        homeTab: "Accueil",

        shopTab: "Boutique",
        langLabel: "Langue",
        about1: "Trois enfants (De Drei Kids). Deux parents. Une imprimante qui s'arrête rarement.",
        about2: "Entre les couches et la porte de l'école, on imprime des jouets sensoriels. Avec une bonne dose de créativité, de curiosité et un petit peu de chaos sain, on construit notre propre aventure 3D !",

    var lang = document.getElementById("lang");
    var tabs = document.querySelectorAll(".tab");

    function applyLanguage(code) {
      var t = TEXTS[code] || TEXTS.nl;
      document.documentElement.lang = code === "en" ? "en" : code;
      document.getElementById("lang-label").textContent = t.langLabel;
      document.getElementById("tab-home").textContent = t.homeTab;
      document.getElementById("tab-about").textContent = t.aboutTab;
      document.getElementById("tab-concept").textContent = t.conceptTab;
      document.getElementById("tab-shop").textContent = t.shopTab;
      document.querySelectorAll("[data-key]").forEach(function (node) {
        node.textContent = t[node.getAttribute("data-key")] || "";
      });
    }

    var printTimer = 0;
    var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function finishPrint() {
      var lockup = document.getElementById("lockup");
      lockup.classList.remove("is-printing");
      lockup.classList.add("is-ready");
      document.body.classList.add("is-ready");
      document.getElementById("wordmark").removeAttribute("aria-hidden");
    }

    function playPrint() {
      var lockup = document.getElementById("lockup");
      window.clearTimeout(printTimer);
      lockup.classList.remove("is-printing", "is-ready");
      document.body.classList.remove("is-ready");
      document.getElementById("wordmark").setAttribute("aria-hidden", "true");
      if (reduceMotion) {
        finishPrint();
        return;
      }
      void lockup.offsetWidth;
      lockup.classList.add("is-printing");
      printTimer = window.setTimeout(finishPrint, 2750);
    }

    function show(view) {
      document.body.setAttribute("data-view", view);
      tabs.forEach(function (tab) {
        tab.setAttribute("aria-selected", tab.getAttribute("data-view") === view ? "true" : "false");
      });
      if (view === "home") {
        playPrint();
        return;
      }
      window.clearTimeout(printTimer);
      document.getElementById("lockup").classList.remove("is-printing");
      document.getElementById("lockup").classList.add("is-ready");
      document.body.classList.add("is-ready");
    }

    tabs.forEach(function (tab) {
      tab.addEventListener("click", function () {
        show(tab.getAttribute("data-view"));
      });
    });

    lang.addEventListener("change", function () { applyLanguage(lang.value); paintHud(); });
    applyLanguage("nl");
    show("home");

    var gameEl = document.getElementById("game");
    var canvas = document.getElementById("board");
    var ctx = canvas.getContext("2d");
    var cols = 18;
    var rows = 18;
    var typed = "";
    var timer = 0;
    var state = null;
    var colors = ["#e15b3a", "#f0b429", "#2f8f6b", "#d45d7a"];

    function paintHud() {
      var t = TEXTS[lang.value] || TEXTS.nl;
      document.getElementById("game-title").textContent = t.gameTitle;
      document.getElementById("game-score").textContent = state ? String(state.score) : "0";
      document.getElementById("game-help").textContent = state && state.over ? t.gameOver : t.gameHelp;
    }

    function cell() { return canvas.width / cols; }

    function emptySpot(snake) {
      var spot;
      do {
        spot = { x: Math.floor(Math.random() * cols), y: Math.floor(Math.random() * rows) };
      } while (snake.some(function (part) { return part.x === spot.x && part.y === spot.y; }));
      return spot;
    }

    function freshFood(snake) {
      var spot = emptySpot(snake);
      spot.color = colors[Math.floor(Math.random() * colors.length)];
      spot.angle = Math.random() * Math.PI;
      return spot;
    }

    function resetGame() {
      state = {
        snake: [{ x: 8, y: 9 }, { x: 7, y: 9 }, { x: 6, y: 9 }],
        dir: { x: 1, y: 0 },
        next: { x: 1, y: 0 },
        score: 0,
        over: false
      };
      state.food = freshFood(state.snake);
      paintHud();
      draw();
    }

    function openGame() {
      gameEl.hidden = false;
      gameEl.classList.add("open");
      resetGame();
      window.clearInterval(timer);
      timer = window.setInterval(tick, 150);
    }

    function closeGame() {
      window.clearInterval(timer);
      gameEl.classList.remove("open");
      gameEl.hidden = true;
      state = null;
    }

    function turn(x, y) {
      if (!state || state.over) return;
      if (x === -state.dir.x && y === -state.dir.y) return;
      state.next = { x: x, y: y };
    }

    function tick() {
      if (!state || state.over) return;
      state.dir = state.next;
      var head = {
        x: state.snake[0].x + state.dir.x,
        y: state.snake[0].y + state.dir.y
      };
      var willEat = head.x === state.food.x && head.y === state.food.y;
      var body = willEat ? state.snake : state.snake.slice(0, -1);
      var hitWall = head.x < 0 || head.y < 0 || head.x >= cols || head.y >= rows;
      var hitSelf = body.some(function (part) { return part.x === head.x && part.y === head.y; });
      if (hitWall || hitSelf) {
        state.over = true;
        paintHud();
        draw();
        return;
      }
      state.snake.unshift(head);
      if (head.x === state.food.x && head.y === state.food.y) {
        state.score += 1;
        state.food = freshFood(state.snake);
        paintHud();
      } else {
        state.snake.pop();
      }
      draw();
    }

    function roundFilament(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
      ctx.fill();
    }

    function drawNozzle(cx, cy, dir, size) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(Math.atan2(dir.y, dir.x) + Math.PI / 2);
      ctx.fillStyle = "#1a1a1a";
      ctx.fillRect(-size * 0.28, -size * 0.46, size * 0.56, size * 0.18);
      ctx.beginPath();
      ctx.moveTo(-size * 0.36, -size * 0.28);
      ctx.lineTo(size * 0.36, -size * 0.28);
      ctx.lineTo(size * 0.16, size * 0.18);
      ctx.lineTo(-size * 0.16, size * 0.18);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-size * 0.1, size * 0.18);
      ctx.lineTo(size * 0.1, size * 0.18);
      ctx.lineTo(0, size * 0.42);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function draw() {
      if (!state) return;
      var s = cell();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#fffdfb";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      var food = state.food;
      ctx.save();
      ctx.translate((food.x + 0.5) * s, (food.y + 0.5) * s);
      ctx.rotate(food.angle);
      ctx.fillStyle = food.color;
      roundFilament(-s * 0.34, -s * 0.12, s * 0.68, s * 0.24, s * 0.12);
      ctx.restore();

      ctx.strokeStyle = "#1a1a1a";
      ctx.lineWidth = s * 0.42;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.beginPath();
      state.snake.forEach(function (part, index) {
        var x = (part.x + 0.5) * s;
        var y = (part.y + 0.5) * s;
        if (index === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();

      var head = state.snake[0];
      drawNozzle((head.x + 0.5) * s, (head.y + 0.5) * s, state.dir, s * 0.92);

      if (state.over) {
        ctx.fillStyle = "rgba(247, 244, 239, 0.72)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
    }

    document.getElementById("game-close").addEventListener("click", closeGame);
    gameEl.addEventListener("click", function (event) {
      if (event.target === gameEl) closeGame();
    });

    document.addEventListener("keydown", function (event) {
      var tag = event.target && event.target.tagName;
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;

      if (gameEl.classList.contains("open")) {
        var key = event.key;
        if (key === "Escape") closeGame();
        else if (key === "ArrowUp" || key === "w" || key === "W") turn(0, -1);
        else if (key === "ArrowDown" || key === "s" || key === "S") turn(0, 1);
        else if (key === "ArrowLeft" || key === "a" || key === "A") turn(-1, 0);
        else if (key === "ArrowRight" || key === "d" || key === "D") turn(1, 0);
        else if ((key === " " || key === "Enter") && state && state.over) resetGame();
        if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].indexOf(key) !== -1) event.preventDefault();
        return;
      }

      if (event.key.length !== 1 || !/[a-z]/i.test(event.key)) {
        typed = "";
        return;
      }
      typed = (typed + event.key).slice(-5).toLowerCase();
      if (typed === "print") {
        typed = "";
        openGame();
      }
    });
  </script>
</body>
</html>
